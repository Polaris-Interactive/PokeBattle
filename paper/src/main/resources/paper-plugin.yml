name: PokeBattle
version: '${project.version}'
main: com.astralrealms.poke.battle.PokeBattle
api-version: '26.3'
authors: [ Roch Blondiaux ]
# Not folia-supported while AstralCore is not: the code still only uses region/entity/async schedulers
dependencies:
  server:
    AstralCore:
      load: BEFORE
      required: true
      join-classpath: true
    PokeCore:
      load: BEFORE
      required: true
      join-classpath: true
    AstralSkill:
      load: BEFORE
      required: false
      join-classpath: true
    AstralHud:
      load: BEFORE
      required: false
      join-classpath: true
    AstralHologram:
      load: BEFORE
      required: false
      join-classpath: true
    PokeEntities:
      load: BEFORE
      required: false
      join-classpath: true
    # Arena servers: battles started in an instance
    PolarisInstances:
      load: BEFORE
      required: false
      join-classpath: true
    # Servers that send players to arenas
    PolarisInstances-Bridge:
      load: BEFORE
      required: false
      join-classpath: true
