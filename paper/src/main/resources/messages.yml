# Admin
reloaded: "<success>Configuration rechargée."
unexpected-error: "<error>Une erreur inattendue est survenue, réessayez plus tard."
unknown-species: "<error>Espèce inconnue : <white>%species%</white>."
battle-aborted-by-admin: "<success>Combat de <white>%player%</white> interrompu."
player-not-in-battle: "<error><white>%player%</white> n'est pas en combat sur ce serveur."

# Starting a battle
already-in-battle: "<error>Vous êtes déjà en combat."
no-usable-creature: "<error>Aucune de vos créatures n'est en état de combattre."
no-battle-worker: "<error>Aucun serveur de combat n'est disponible, réessayez dans un instant."
battle-refused: "<error>Ce combat n'a pas pu commencer."

# Choices
not-in-battle: "<error>Vous n'êtes pas en combat."
waiting-for-turn: "<info>Patientez, le tour est en cours."
choice-unavailable: "<error>Ce choix n'est pas possible maintenant."
choice-refused: "<warning>Ce choix a été refusé, choisissez à nouveau."
reopen-hint: "<gray>Tapez <white>/combat</white> pour choisir votre action."

# End of a battle
battle-won: "<success>Vous avez gagné le combat !"
battle-lost: "<error>Toutes vos créatures sont K.O..."
battle-tie: "<info>Le combat se termine sur une égalité."
battle-aborted: "<warning>Le combat a été interrompu."
settlement-failed: "<error>Le résultat du combat n'a pas pu être enregistré."
experience-gained: "<info><white>%pokemon%</white> gagne <white>%experience%</white> points d'expérience."
level-up: "<success><white>%pokemon%</white> monte au niveau <white>%level%</white> !"
move-learned: "<success><white>%pokemon%</white> apprend <white>%move%</white> !"
move-pending: "<info><white>%pokemon%</white> voudrait apprendre <white>%move%</white>, mais connaît déjà quatre capacités."

# Battle log. %pokemon% is the creature as named in the log (foe-name for the opponent's), %name% its plain name.
foe-name-wild: "<white>%name%</white> sauvage"
log-wild-appears: "<gray>Un <white>%name%</white> sauvage apparaît !"
log-send-out: "<gray>Vas-y, <white>%name%</white> !"
log-turn: "<dark_gray>— Tour %turn% —"
log-move: "%pokemon% <gray>utilise <white>%move%</white> !"
log-hp-ally: "<gray>%name% : <white>%hp%</white>/%max% PV"
log-hp-foe: "<gray>%name% : <white>%percent%</white>/100 PV"
log-damage-from: "%pokemon% <gray>souffre de <white>%effect%</white>."
log-heal: "%pokemon% <gray>récupère des PV."
log-faint: "%pokemon% <red>est K.O. !"
log-super-effective: "<gold>C'est super efficace !"
log-resisted: "<gray>Ce n'est pas très efficace..."
log-immune: "<gray>Cela n'affecte pas %pokemon%<gray>..."
log-crit: "<gold>Coup critique !"
log-miss: "%pokemon% <gray>évite l'attaque !"
log-fail: "<gray>Mais cela échoue !"
log-status: "%pokemon% <gray>est atteint de <white>%status%</white>."
log-cure-status: "%pokemon% <gray>n'est plus atteint de <white>%status%</white>."
log-boost: "<gray>%stat% de %pokemon% <gray>augmente (+%amount%)."
log-unboost: "<gray>%stat% de %pokemon% <gray>baisse (-%amount%)."
log-cant: "%pokemon% <gray>ne peut pas agir (<white>%reason%</white>)."

# Choice dialog
dialog-title: "<gold>Combat <gray>· tour %turn%"
dialog-field: "<white>%foe%</white> <gray>N.%foe_level% · <white>%foe_percent%</white>/100 PV %foe_status%<newline><white>%ally%</white> <gray>N.%ally_level% · <white>%ally_hp%</white>/%ally_max% PV %ally_status%"
dialog-forced-switch: "<yellow>%ally% est K.O. : choisissez qui envoyer."
dialog-status: "<yellow>(%status%)"
move-button: "<white>%move%</white> <gray>%pp%/%max_pp%"
move-button-disabled: "<dark_gray>%move% %pp%/%max_pp%"
move-tooltip: "<gray>Type : <white>%type%</white><newline><gray>Catégorie : <white>%category%</white><newline><gray>Puissance : <white>%power%</white><newline><gray>Précision : <white>%accuracy%</white>"
team-button: "<aqua>Équipe"
team-title: "<aqua>Qui envoyer ?"
member-button: "<white>%name%</white> <gray>N.%level% · %hp%/%max% PV %status%"
back-button: "<gray>Retour"
