# Admin
reloaded: "<success>Configuration rechargée."
unexpected-error: "<error>Une erreur inattendue est survenue, réessaie plus tard."
battle-aborted-by-admin: "<success>Combat de <white>%player%</white> interrompu."
player-not-in-battle: "<error><white>%player%</white> n'est pas en combat sur ce serveur."

# Starting a battle (already-in-battle and unknown-species are PokeCore's shared messages)
no-usable-creature: "<error>Aucune de tes créatures n'est en état de combattre."
no-battle-worker: "<error>Aucun serveur de combat n'est disponible, réessaie dans un instant."
battle-refused: "<error>Ce combat n'a pas pu commencer."

# Choices
not-in-battle: "<error>Tu n'es pas en combat."
waiting-for-turn: "<info>Patiente, le tour est en cours."
choice-unavailable: "<error>Ce choix n'est pas possible maintenant."
choice-refused: "<warning>Ce choix a été refusé, choisis à nouveau."
reopen-hint: "<gray>Tape <white>/combat</white> pour choisir ton action."
battle-recovering: "<warning>Le combat a été interrompu par un incident, reprise en cours…"
battle-resumed: "<info>Ton combat reprend où il en était."
arena-requesting: "<info>Préparation de l'arène…"
arena-unavailable: "<error>Aucune arène n'est disponible pour le moment, réessaie plus tard."
arena-battle-failed: "<error>Le combat n'a pas pu commencer, retour en cours."
no-balls: "<warning>Tu n'as aucune Ball."
no-battle-items: "<warning>Tu n'as aucun objet utilisable en combat."
item-no-target: "<warning>Cet objet n'aurait aucun effet sur ton équipe."
item-missing: "<error>Tu n'as plus cet objet."
item-refunded: "<info>%item% <info>t'a été rendu."
capture-no-room: "<error>Ton équipe et ton PC sont pleins : libère une place avant de lancer une Ball."

# End of a battle
battle-won: "<success>Tu as gagné le combat !"
battle-lost: "<error>Toutes tes créatures sont K.O..."
# Against an NPC trainer; %trainer% is its name
battle-won-trainer: "<success>Tu as battu <white>%trainer%</white> !"
battle-lost-trainer: "<error>Tu as perdu contre <white>%trainer%</white>..."
battle-tie: "<info>Le combat se termine sur une égalité."
battle-aborted: "<warning>Le combat a été interrompu."
battle-fled: "<info>Tu as pris la fuite."
battle-captured: "<success><white>%pokemon%</white> a été capturé ! Il rejoint ton équipe."
battle-captured-pc: "<success><white>%pokemon%</white> a été capturé ! Il a été envoyé dans le PC (boîte %box%)."
capture-storage-full: "<error>Ton équipe et ton PC sont pleins : <white>%pokemon%</white> n'a pas pu être gardé."
capture-failed: "<error>La capture de <white>%pokemon%</white> n'a pas pu être enregistrée."
settlement-failed: "<error>Le résultat du combat n'a pas pu être enregistré."
experience-gained: "<info><white>%pokemon%</white> gagne <white>%experience%</white> points d'expérience."
level-up: "<success><white>%pokemon%</white> monte au niveau <white>%level%</white> !"
move-learned: "<success><white>%pokemon%</white> apprend <white>%move%</white> !"
move-pending: "<info><white>%pokemon%</white> voudrait apprendre <white>%move%</white>, mais connaît déjà quatre capacités."

# Battle log. %pokemon% is the creature as named in the log (foe-name for the opponent's), %name% its plain name.
foe-name-wild: "<white>%name%</white> sauvage"
# An NPC trainer's creature; %trainer% is the trainer's name in every log line of a trainer battle
foe-name-trainer: "<white>%name%</white> <gray>de</gray> <white>%trainer%</white>"
log-wild-appears: "<gray>Un <white>%name%</white> sauvage apparaît !"
log-trainer-challenge: "<white>%trainer%</white> <gray>veut se battre !"
log-trainer-sends: "<white>%trainer%</white> <gray>envoie <white>%name%</white> !"
log-send-out: "<gray>Vas-y, <white>%name%</white> !"
log-turn: "<dark_gray>— Tour %turn% —"
log-move: "%pokemon% <gray>utilise <white>%move%</white> !"
log-hp-ally: "<gray>%name% : <white>%hp%</white>/%max% PV"
log-hp-foe: "<gray>%name% : <white>%percent%</white>/100 PV"
log-damage-from: "%pokemon% <gray>souffre de <white>%effect%</white>."
log-heal: "%pokemon% <gray>récupère des PV."
log-faint: "%pokemon% <red>est K.O. !"
log-super-effective: "<gold>C'est super efficace !"
log-resisted: "<gray>Ce n'est pas très efficace..."
log-immune: "<gray>Cela n'affecte pas %pokemon%<gray>..."
log-crit: "<gold>Coup critique !"
log-miss: "%pokemon% <gray>évite l'attaque !"
log-fail: "<gray>Mais cela échoue !"
log-status: "%pokemon% <gray>est atteint de <white>%status%</white>."
log-cure-status: "%pokemon% <gray>n'est plus atteint de <white>%status%</white>."
log-boost: "<gray>%stat% de %pokemon% <gray>augmente (+%amount%)."
log-unboost: "<gray>%stat% de %pokemon% <gray>baisse (-%amount%)."
log-cant: "%pokemon% <gray>ne peut pas agir (<white>%reason%</white>)."
# %ball% / %item%: the item's name; %shakes%: 0 to 3
log-ball-caught: "<gray>Tu lances %ball%<gray>... <green>Capturé ! %pokemon% <green>est à toi."
log-ball-free: "<gray>Tu lances %ball%<gray>... %pokemon% <gray>s'en libère ! <dark_gray>(%shakes% secousse(s))"
log-run-escaped: "<gray>Tu prends la fuite !"
log-run-failed: "<gray>Impossible de fuir !"
log-item: "<gray>Tu utilises %item% <gray>sur %pokemon%<gray>."
log-revive: "%pokemon% <gray>reprend connaissance !"
log-timer: "<warning>Temps écoulé : une action a été choisie pour toi."
# Doubles: Ally Switch, the creature traded places with its partner.
log-swap: "%pokemon% <gray>change de place avec son partenaire !"

# Choice dialog
dialog-title: "<gold>Combat <gray>· tour %turn%"
dialog-field: "<white>%foe%</white> <gray>N.%foelevel% · <white>%foepercent%</white>/100 PV %foestatus%<newline><white>%ally%</white> <gray>N.%allylevel% · <white>%allyhp%</white>/%allymax% PV %allystatus%"
dialog-forced-switch: "<yellow>%ally% est K.O. : choisis qui envoyer."
dialog-status: "<yellow>(%status%)"
move-button: "<white>%move%</white> <gray>%pp%/%maxpp%"
move-button-disabled: "<dark_gray>%move% %pp%/%maxpp%"
move-tooltip: "<gray>Type : <white>%type%</white><newline><gray>Catégorie : <white>%category%</white><newline><gray>Puissance : <white>%power%</white><newline><gray>Précision : <white>%accuracy%</white>"
team-button: "<aqua>Équipe"
team-title: "<aqua>Qui envoyer ?"
member-button: "<white>%name%</white> <gray>N.%level% · %hp%/%max% PV %status%"
back-button: "<gray>Retour"
ball-button: "<gold>Ball"
bag-button: "<green>Sac"
run-button: "<gray>Fuite"
balls-title: "<gold>Quelle ball lancer ?"
bag-title: "<green>Quel objet utiliser ?"
bag-entry-button: "%item% <gray>×%amount%"
target-title: "<green>Sur qui utiliser %item%<green> ?"
target-button: "<white>%name%</white> <gray>N.%level% · %hp%/%max% PV %status%"
target-fainted: "<red>K.O."
# Doubles: each creature of a side on its own line (the dialog's field), which creature is being chosen for, and
# where a move that needs a target is aimed (the opponent's creatures, then the player's own).
dialog-field-foe: "<white>%name%</white> <gray>N.%level% · <white>%percent%</white>/100 PV %status%"
dialog-field-ally: "<white>%name%</white> <gray>N.%level% · <white>%hp%</white>/%max% PV %status%"
dialog-slot: "<aqua>Que doit faire <white>%ally%</white><aqua> ?"
aim-title: "<aqua>Sur qui utiliser %move%<aqua> ?"
aim-foe-button: "<red>Adversaire</red> <white>%name%</white> <gray>N.%level% · %percent%/100 PV %status%"
aim-ally-button: "<green>Allié</green> <white>%name%</white> <gray>N.%level% · %hp%/%max% PV %status%"

# Battle HUD (AstralHologram). Dialog texts above are reused for the move, team, bag and target buttons and the menu
# titles. %bar%: the health bar (hud.bar in config.yml); %status%: dialog-status, empty when healthy.
# Cards and buttons are text: a resource-pack font glyph (<font:...>) can draw a frame or an icon behind them.
hud-foe-name: "<white><b>%name%</b></white> %status% <gray>N.</gray><white>%level%"
hud-foe-hp: "<gray>%percent% %"
hud-ally-name: "<white><b>%name%</b></white> %status% <gray>N.</gray><white>%level%"
hud-ally-hp: "<white>%hp%</white><gray>/%max% PV"
# A card drawn on the screen (hud.overlay in config.yml): the name on the left of its strip, the level on its right.
# Colours are the closest of the overlay's palette; hud-ally-hp and hud-foe-hp are drawn under the health bar.
hud-overlay-name: "<white>%name%"
hud-overlay-level: "<#D0D0D0>N.</#D0D0D0><white>%level%"
hud-fight-label: "<white>Attaque"
hud-team-label: "<white>Équipe"
hud-bag-label: "<white>Sac"
hud-run-label: "<white>Fuite"
hud-timer: "<gray>Tour <white>%turn%</white> · <white>%seconds%</white> s"
# The last seconds of the turn (hud.timer-warning in config.yml)
hud-timer-urgent: "<gray>Tour <white>%turn%</white> · <#EB5757><b>%seconds%</b> s"
hud-turn: "<gray>Tour <white>%turn%"
hud-prompt: "<white>Que doit faire %ally% ?"
hud-moves-title: "<white>Quelle capacité ?"
# A move button: %icon% is its type's badge, %pp% its PP coloured by what is left (plain on a move that cannot be used).
hud-move-button: "%icon% <white>%move%</white> %pp%"
hud-move-button-disabled: "%icon% <dark_gray>%move% %pp%/%maxpp%"
# The main menu, one colour per action
hud-ball-button: "<white> Capture   </white><#F2C94C>◓ ▌"
# %page% of %pages%
hud-next-button: "<gray>Suivant <white>%page%</white>/%pages% ›"
# While the camera follows the turn; F skips it (and the drop key goes back in the menu)
hud-skip-hint: "<gray>[<white>F</white>] Passer"
hud-closed: "<gray>Tape <white>/combat</white> pour revenir au combat."
# The tooltip of a hovered move: %icon% is its type's badge, %pp% its PP coloured by what is left.
hud-tooltip-move: "%icon% <white>%move%</white>  %pp%<newline><#4FA59B>━━━━━━━━━━━━<newline><gray>Type : <white>%type%<newline><gray>Catégorie : <white>%category%<newline><gray>Puissance : <white>%power%<newline><gray>Précision : <white>%accuracy%"
# The tooltip of a hovered team member: one line per move (hud-tooltip-member-move), then its ability and Speed.
hud-tooltip-member-move: "%icon% <white>%move%</white>  %pp%"
# %details% is hud-tooltip-ability, empty when the ability is not known in the bundle.
hud-tooltip-member: "%moves%<newline><#4FA59B>━━━━━━━━━━━━<newline><#7FD7D0>Talent : <white>%ability%%details%<newline><#F2C94C>⚡ Vitesse : <white>%speed%"
hud-tooltip-ability: "<newline><gray>%description%"
# The tooltip of the opponent's card: what the battle shows of it (its ability stays unknown until it is used).
hud-tooltip-foe: "<white>%name%</white> <gray>N.%level%<newline><#4FA59B>━━━━━━━━━━━━<newline><gray>PV : <white>%percent%%<newline><gray>Statut : <white>%status%<newline><#7FD7D0>Talent : <white>?"
# The tooltip of a hovered bag item or ball: its name and how many, then what it does (one hud-effect-* line each).
hud-tooltip-item: "<white>%name%</white>  <gray>×%amount%<newline><#4FA59B>━━━━━━━━━━━━<newline>%effects%"
hud-effect-heal: "<gray>Rend <white>%amount%</white> PV"
hud-effect-heal-all: "<gray>Rend tous les PV"
hud-effect-heal-percent: "<gray>Rend <white>%percent%</white> des PV"
hud-effect-cure: "<gray>Soigne le statut"
hud-effect-cure-only: "<gray>Soigne : <white>%statuses%</white>"
hud-effect-revive: "<gray>Ranime avec <white>%percent%</white> des PV"
hud-effect-pp: "<gray>Restaure <white>%amount%</white> PP"
hud-effect-pp-all: "<gray>Restaure tous les PP"
hud-effect-pp-one: "<gray>Restaure <white>%amount%</white> PP à une capacité"
hud-effect-pp-one-all: "<gray>Restaure tous les PP d'une capacité"
hud-effect-boost: "<gray>Augmente <white>%stat%</white> de <white>%stages%</white> niveaux"
hud-effect-ball: "<gray>Capture un Pokémon sauvage"
# Team and target buttons in the HUD: two short lines, so they fit their strip next to the creature's icon.
# %hp% is coloured by what is left; %status% is hud-member-status (or target-fainted), empty when healthy.
hud-member-button: "<white>%name%</white> <gray>N.%level%<newline>%hp% <gray>PV</gray> %status%"
hud-target-button: "<white>%name%</white> <gray>N.%level%<newline>%hp% <gray>PV</gray> %status%"
# Doubles: where a move is aimed, on the same strips (%hp% is the percentage for the opponent's creatures).
hud-aim-foe-button: "<red>Adv.</red> <white>%name%</white> <gray>N.%level%<newline>%hp% <gray>%</gray> %status%"
hud-aim-ally-button: "<green>Allié</green> <white>%name%</white> <gray>N.%level%<newline>%hp% <gray>PV</gray> %status%"
# %status%: the status cut to its first three letters (BRÛ, PAR...).
hud-member-status: "<yellow>%status%"
# In place of %status% for the creature on the field (the team menu lists the whole team; it cannot be sent in).
# Keep it short: the line has to fit the strip next to the icon.
hud-member-active: "<#7FD7D0>actif"
# The HP a creature lost, rising above it on stage (creatures.hit.numbers): the player's creature in HP, the opponent's
# in percent (the simulator only tells its HP as a percentage).
hit-damage-ally: "<bold><#FF5555>-%amount%"
hit-damage-foe: "<bold><#FF5555>-%amount% %"
