dialog-forced-switch: "<yellow>%ally% est K.O. : choisissez qui envoyer."
dialog-status: "<yellow>(%status%)"
move-button: "<white>%move%</white> <gray>%pp%/%maxpp%"
move-button-disabled: "<dark_gray>%move% %pp%/%maxpp%"
move-tooltip: "<gray>Type : <white>%type%</white><newline><gray>Catégorie : <white>%category%</white><newline><gray>Puissance : <white>%power%</white><newline><gray>Précision : <white>%accuracy%</white>"
team-button: "<aqua>Équipe"
team-title: "<aqua>Qui envoyer ?"
member-button: "<white>%name%</white> <gray>N.%level% · %hp%/%max% PV %status%"
back-button: "<gray>Retour"
ball-button: "<gold>Ball"
bag-button: "<green>Sac"
run-button: "<gray>Fuite"
balls-title: "<gold>Quelle ball lancer ?"
bag-title: "<green>Quel objet utiliser ?"
bag-entry-button: "%item% <gray>×%amount%"
target-title: "<green>Sur qui utiliser %item%<green> ?"
target-button: "<white>%name%</white> <gray>N.%level% · %hp%/%max% PV %status%"
target-fainted: "<red>K.O."

# Battle HUD (AstralHologram). Dialog texts above are reused for the move, team, bag and target buttons and the menu
# titles. %bar%: the health bar (hud.bar in config.yml); %status%: dialog-status, empty when healthy.
# Cards and buttons are text: a resource-pack font glyph (<font:...>) can draw a frame or an icon behind them.
hud-foe-name: "<white><b>%name%</b></white> %status% <gray>N.</gray><white>%level%"
hud-foe-hp: "<gray>%percent% %"
hud-ally-name: "<white><b>%name%</b></white> %status% <gray>N.</gray><white>%level%"
hud-ally-hp: "<white>%hp%</white><gray>/%max% PV"
hud-fight-label: "<white>Attaque"
hud-team-label: "<white>Équipe"
hud-bag-label: "<white>Sac"
hud-run-label: "<white>Fuite"
hud-timer: "<gray>Tour <white>%turn%</white> · <white>%seconds%</white> s"
hud-turn: "<gray>Tour <white>%turn%"
hud-prompt: "<white>Que doit faire %ally% ?"
hud-moves-title: "<white>Quelle capacité ?"
hud-waiting: "<gray>En attente..."
# The main menu, one colour per action
hud-ball-button: "<white> Capture   </white><#F2C94C>◓ ▌"
hud-next-button: "<gray>Suivant ›"
# While the camera follows the turn; F skips it
hud-skip-hint: "<gray>[<white>F</white>] Passer"
hud-closed: "<gray>Tapez <white>/combat</white> pour revenir au combat."
# The tooltip of a hovered move: %icon% is its type's badge, %pp% its PP coloured by what is left.
hud-tooltip-move: "%icon% <white>%move%</white>  %pp%<newline><#4FA59B>━━━━━━━━━━━━<newline><gray>Type : <white>%type%<newline><gray>Catégorie : <white>%category%<newline><gray>Puissance : <white>%power%<newline><gray>Précision : <white>%accuracy%"
# The tooltip of a hovered team member: one line per move (hud-tooltip-member-move), then its ability and Speed.
hud-tooltip-member-move: "%icon% <white>%move%</white>  %pp%"
hud-tooltip-member: "%moves%<newline><#4FA59B>━━━━━━━━━━━━<newline><#7FD7D0>Talent : <white>%ability%<newline><#F2C94C>⚡ Vitesse : <white>%speed%"
# The HP a creature lost, rising above it on stage (creatures.hit.numbers): the player's creature in HP, the opponent's
# in percent (the simulator only tells its HP as a percentage).
hit-damage-ally: "<bold><#FF5555>-%amount%"
hit-damage-foe: "<bold><#FF5555>-%amount% %"
