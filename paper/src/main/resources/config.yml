# PokeBattle configuration

settings:
  # Verbose logging for this plugin.
  debug: false

start:
  # How long a battle worker has to take a battle. Keep it close to the start queue's TTL (START_TTL_MS, 10 s).
  timeout: 10s
  # Attempts with the same battle id when no worker answers (a worker that already took it drops the copy).
  attempts: 2

battle:
  # GDD: 40 s per turn, after which the AI chooses for the player. 0 disables it.
  turn-timer-seconds: 40
  # The per-player lock (one battle at a time, network-wide). Refreshed on every request, so only an idle battle
  # outlives it.
  lock-ttl: 15m
  # A player who leaves for longer than this loses the battle with no penalty (GDD). Rejoining this server in time
  # resumes it.
  disconnect-grace: 60s
  # After asking a worker to stop a battle, how long to wait for its end before releasing the players anyway.
  end-timeout: 15s

arena:
  # Battles in arenas (PolarisInstances instances on instance servers). The arena template's spawn point the battle is
  # staged at: the player's side stands there, facing the opponent. Without it, the battle is laid in front of where
  # the player arrives.
  stage-spawn: stage
  # After the battle ends, how long before the arena closes and the player goes back to their server.
  return-delay: 3s

recovery:
  # How often this server checks that the workers of its battles still beat. A dead worker's battles are replayed on
  # another one and resume where they were. Keep it below the workers' HEARTBEAT_TTL_SECONDS (5 s).
  check-interval: 2s

rewards:
  # Product of every experience bonus for these battles; the formula itself is PokeCore's (modern, level-scaled).
  experience-multiplier: 1.0
  # Whether defeated creatures give their EV yield.
  effort-values: true
  # Friendship each rewarded creature gains for a win (not in the GDD: 0 by default).
  friendship-on-win: 0
  # Whether catching the opponent gives experience and EVs as defeating it would (modern rule).
  experience-on-capture: true

dialog:
  # Move buttons per row in the choice dialog.
  move-columns: 2


# Where a battle takes place, laid in front of where the player stood when it was first shown: `forward` the way they
# looked, `right` (left when negative), `up` from their feet, in blocks. The creatures stand there and the HUD camera
# films it.
stage:
  # Where the creatures stand (GDD: 6 blocks apart).
  ally: { forward: 3, right: -0.8, up: 0 }
  foe: { forward: 8.8, right: 0.8, up: 0 }

# The two creatures standing on the stage, seen only by the player (needs PokeEntities, its models and blueprints).
creatures:
  enabled: true
  # By moment, the model animations to try; the first one the model has plays. BetterModel plays idle and walk itself.
  animations:
    # Looped for as long as the creature stands on stage (its battle stance); without one, its own idle.
    stance: [battle_idle]
    switch: [cry]
    # A move plays its category's list (move-physical, move-special, move-status), else `move`. {move} is the move's id:
    # a model's own animation for that move (vinewhip, protect...) plays first when it has one.
    move: ["{move}", physical, special, status, cry]
    move-physical: ["{move}", physical, special, cry]
    move-special: ["{move}", special, physical, cry]
    move-status: ["{move}", status, cry, special]
    damage: [damage, recoil]
    faint: [death, faint]
  # The least time a moment the creatures play takes (an attack, a hit, a faint), so they come one after the other.
  # A camera shot longer than this sets the pace instead.
  cue-spacing: 1s
  # The same for a move: its wind-up (up to the release marker), then its effect reaching the target.
  move-spacing: 2s
  # How long a fainted creature stays (its faint animation) before it goes.
  faint-linger: 3s
  # How long the creatures stay after the battle ended.
  close-delay: 3s
  # What a move looks like on stage (needs AstralSkill and the move skills from poke-content): the attacking creature
  # casts the first of these skills that exists, aimed at the other creature. {move} is the move id (ember), {type}
  # and {category} its type and category (fire, special). A skill reads the distance to the target as
  # %move-distance% (blocks).
  moves:
    enabled: true
    skills: ["move-{move}", "move-{type}-{category}"]
    # Blocks above a creature's feet the effect leaves from and aims at.
    height: 0.7
    # The skills a creature casts when one of its stats rises or falls (Growl, Smokescreen...), empty for none.
    stat-up: "move-fx-stat-up"
    stat-down: "move-fx-stat-down"
    # The effect leaves when the move's animation reaches this marker: a `pokesmp:<name>` timeline keyframe, written by
    # the model installer at the animation's strike (or placed by hand in Blockbench). Without one it leaves at once.
    release-marker: "release"
  # What a hit shows on the creature that takes it.
  hit:
    # Its model flashes red (BetterModel's damage tint).
    flash: true
    # The HP it lost rises above it, seen only by the player (hit-damage-ally / hit-damage-foe in messages.yml).
    numbers: true
    number-life: 1200ms
    # Blocks a number rises while it stays, and its size.
    number-rise: 0.8
    number-scale: 1.2

hud:
  # The battle drawn in front of the player with AstralHologram (Java players). false, without AstralHologram, or
  # for a Bedrock player: the choice dialog above.
  enabled: true
  # Whether sneaking leaves the HUD; /combat brings it back. The battle goes on either way.
  closeable: false
  # Blocks from the eye, for elements that set no depth.
  depth: 2.0
  # The cursor the mouse steers; the mouse no longer turns the view. `range`: how far from the centre it may go, in degrees
  # each way (keep every button inside it). `smoothing`: ticks to glide to each position, 0 to 3.
  cursor:
    text: "<white>●"
    scale: 0.3
    range: { yaw: 52, pitch: 30 }
    sensitivity: 1.5
    smoothing: 0
  # Whether the battle log also goes to the chat (the HUD shows its last lines).
  chat-log: true
  log-lines: 4
  # How long the HUD stays once the battle is over.
  close-delay: 3s
  # #AARRGGBB behind a hovered button (none: the button's art lights up instead), and behind one that cannot be used.
  hover-background: "#00000000"
  disabled-background: "#60202020"
  # Sound keys, empty for none.
  hover-sound: "minecraft:ui.button.click"
  click-sound: ""
  # The creature's icon at the left end of a team or target button, as a share of the button strip's scale; the label
  # moves right to leave it room.
  list-icon: 0.22
  # Health bars: `length` symbols, coloured high above 50 %, medium above 20 %, low below.
  bar:
    length: 54
    symbol: "|"
    high: "#26D971"
    medium: "#F2C94C"
    low: "#EB5757"
    empty: "#3A3A3A"
  # The camera follows the battle: a shot for what happens (a move, a switch, a K.O., a capture, the end), then back
  # to `idle` where the player chooses; the menu shows once it is back. Shots keep clear of blocks: an eye with a block between it
  # and what it looks at rises up to 4 blocks, else comes in front of the block. Places are in blocks from where the battle
  # started: `forward` the way the player looked, `right` (left when negative), `up` from their feet. The HUD moves with
  # the camera. Remove this block, or `enabled: false`, for a still camera where the player stands.
  camera:
    enabled: true
    # Blocks above a creature's feet a shot looks at.
    look-height: 0.9
    # GDD: a camera run lasts at most 6 s. Each moment shows when its shot lands (the HP bars, the log, the creatures);
    # what would go past this shows at once, and F shows the rest at once anyway.
    max-sequence: 6s
    # Shots are laid out for creatures up to `reference-size` blocks (height or width, whichever is bigger). A bigger
    # one is framed from further back, as many times as it is bigger (at most `max-scale`), and looked at that much
    # higher. A creature standing between a shot and what it looks at (a big ally in `idle`) makes the eye rise over it.
    reference-size: 1.5
    max-scale: 4
    # `look-at`: ally, foe or center. `glide`: ticks to get there (0 cuts). `hold`: ticks before the next shot.
    shots:
      # Over the shoulder of the player's creature, the opponent across: where the menu is used.
      idle:        { from: { forward: 0, right: 2.2, up: 2.2 }, look-at: center, glide: 20, hold: 0 }
      ally-move:   { from: { forward: 0.5, right: -2.2, up: 1.8 }, look-at: foe, glide: 12, hold: 25 }
      foe-move:    { from: { forward: 11.5, right: 2.2, up: 2.0 }, look-at: ally, glide: 12, hold: 25 }
      ally-switch: { from: { forward: 5.5, right: -3.2, up: 1.4 }, look-at: ally, glide: 15, hold: 25 }
      foe-switch:  { from: { forward: 6, right: 3.6, up: 1.6 }, look-at: foe, glide: 15, hold: 25 }
      ally-faint:  { from: { forward: 4.5, right: -3, up: 2.6 }, look-at: ally, glide: 15, hold: 25 }
      foe-faint:   { from: { forward: 6.5, right: 3, up: 2.6 }, look-at: foe, glide: 15, hold: 25 }
      capture:     { from: { forward: 5, right: 2, up: 2 }, look-at: foe, glide: 15, hold: 30 }
      end:         { from: { forward: 6, right: -6.5, up: 3.5 }, look-at: center, glide: 30, hold: 30 }
  # Where each element goes, in degrees right (yaw) and down (pitch) from the centre of view. Place them in game:
  # /hologram hud edit while the HUD is open prints these blocks; paste them here, then /pokebattle reload (applies
  # to the next HUD opened). Menu buttons are button-1, button-2... in reading order: add or remove some to change
  # how many entries a page holds.
  # Laid out like a handheld battle screen: the creatures' cards in the top corners, the turn between them, the menu
  # as a grid bottom left, the log bottom right.
  elements:
    # Laid out like the reference battle screen, for the default FOV (70): at a wider FOV everything sits closer to
    # the centre, at a narrower one the corners leave the screen. Computed from screen pixels (1920x1057 at FOV 70)
    # with the HUD's projection: x = F·tan(yaw), y = F·tan(pitch)/cos(yaw), F = 755. Elements lie flat on the screen, so
    # their size goes with depth along the view (d·cos(yaw)·cos(pitch)); an item is 0.95 block wide per unit of
    # scale, text 0.025 block per font pixel.
    #
    # The cards hug the top corners: the frame (`*-frame`, the art), the species in its portrait slot (outer edge),
    # the name and level, the health bar with the HP drawn over it, and the status strip under the card.
    ally-frame:     { position: { yaw: -43.9, pitch: -22.7 }, scale: 0.744, background: false, depth: 2.06 }
    ally-icon:      { position: { yaw: -49.0, pitch: -20.6 }, scale: 0.15, background: false, depth: 2.04 }
    ally-underlay:  { position: { yaw: -49.0, pitch: -20.6 }, scale: 0.122, background: false, depth: 2.05 }
    ally:           { position: { yaw: -42.2, pitch: -24.0 }, scale: 0.154, background: false }
    ally-bar:       { position: { yaw: -42.2, pitch: -22.3 }, scale: 0.135, background: false }
    ally-hp:        { position: { yaw: -42.2, pitch: -22.4 }, scale: 0.102, background: false, depth: 1.97 }
    ally-status:    { position: { yaw: -42.2, pitch: -19.9 }, scale: 0.438, background: false, depth: 2.05 }
    foe-frame:      { position: { yaw: 43.9, pitch: -22.7 }, scale: 0.744, background: false, depth: 2.06 }
    foe-icon:       { position: { yaw: 49.0, pitch: -20.6 }, scale: 0.15, background: false, depth: 2.04 }
    foe-underlay:   { position: { yaw: 49.0, pitch: -20.6 }, scale: 0.122, background: false, depth: 2.05 }
    foe:            { position: { yaw: 42.2, pitch: -24.0 }, scale: 0.154, background: false }
    foe-bar:        { position: { yaw: 42.2, pitch: -22.3 }, scale: 0.135, background: false }
    foe-hp:         { position: { yaw: 42.2, pitch: -22.4 }, scale: 0.102, background: false, depth: 1.97 }
    foe-status:     { position: { yaw: 42.2, pitch: -19.9 }, scale: 0.438, background: false, depth: 2.05 }
    # The turn and its timer, top centre; the skip hint under it while the camera moves.
    timer:          { position: { yaw: 1.1, pitch: -31.7 }, scale: 0.180, background: false }
    turn-icon:      { position: { yaw: -6.1, pitch: -32.1 }, scale: 0.072, background: false, depth: 2.05 }
    hint:           { position: { yaw: 0.0, pitch: -29.1 }, scale: 0.159, background: false }
    # The menu: 2 columns x 3 rows bottom left, in reading order. A button is its art (`frame-N`: the action's art,
    # or a strip for lists) with its label over it; hovered, the art shows its second state.
    prompt:         { position: { yaw: -40.7, pitch: 9.7 }, scale: 0.170, background: false }
    frame-1:        { position: { yaw: -46.5, pitch: 11.3 }, scale: 0.515, background: false, depth: 2.05 }
    button-1:       { position: { yaw: -46.8, pitch: 11.8 }, scale: 0.152, background: false }
    frame-2:        { position: { yaw: -33.8, pitch: 13.6 }, scale: 0.617, background: false, depth: 2.05 }
    button-2:       { position: { yaw: -34.2, pitch: 14.2 }, scale: 0.182, background: false }
    frame-3:        { position: { yaw: -46.5, pitch: 15.8 }, scale: 0.506, background: false, depth: 2.05 }
    button-3:       { position: { yaw: -46.8, pitch: 16.2 }, scale: 0.149, background: false }
    frame-4:        { position: { yaw: -33.8, pitch: 18.8 }, scale: 0.601, background: false, depth: 2.05 }
    button-4:       { position: { yaw: -34.2, pitch: 19.3 }, scale: 0.177, background: false }
    frame-5:        { position: { yaw: -46.5, pitch: 20.0 }, scale: 0.494, background: false, depth: 2.05 }
    button-5:       { position: { yaw: -46.8, pitch: 20.4 }, scale: 0.146, background: false }
    frame-6:        { position: { yaw: -33.8, pitch: 23.7 }, scale: 0.581, background: false, depth: 2.05 }
    button-6:       { position: { yaw: -34.2, pitch: 24.2 }, scale: 0.171, background: false }
    # The back button is its art only (no label); its hitbox covers the art at the same scale.
    back:           { position: { yaw: -46.5, pitch: 23.8 }, scale: 0.2, background: true }
    # The back button's art (an item: its own hover state).
    back-frame:     { position: { yaw: -46.5, pitch: 23.8 }, scale: 0.2, background: false, depth: 2.05 }
    next:           { position: { yaw: -33.8, pitch: 28.0 }, scale: 0.178, background: true }
    # The tooltip of a hovered move or team member, on its panel right of the menu (lines aligned left).
    info-frame:     { position: { yaw: -14.8, pitch: 21.6 }, scale: 0.723, background: false, depth: 2.06 }
    info:           { position: { yaw: -14.8, pitch: 25.4 }, scale: 0.159, background: false }
    # The log, bottom right, on its panel.
    log-frame:      { position: { yaw: 41.6, pitch: 19.5 }, scale: 1.008, background: false, depth: 2.05 }
    log:            { position: { yaw: 41.6, pitch: 21.5 }, scale: 0.148, background: false }

# Battles fought where they started (not in an arena): a ring on the ground around the stage, seen only by the player,
# and a barrier keeping them inside it. A player held by the HUD does not walk anyway; the barrier is for the dialog.
staging:
  ring: true
  # The ring's centre in the stage's frame (as `stage`): between the player and the opponent.
  centre: { forward: 4.4, right: 0, up: 0 }
  # Blocks; the barrier is the same circle.
  radius: 6.5
  # A particle without extra data (end_rod, happy_villager, wax_on...).
  particle: end_rod
  points: 48
  # How often the ring is drawn again (read at start).
  interval: 500ms
  barrier: true

capture:
  # Onboarding (GDD: the first capture is guaranteed): a ball always catches while the player's Pokédex counts fewer
  # caught species than this. The starter counts one, hence 2. 0 for never.
  guaranteed-below: 2
