# PokeBattle configuration

settings:
  # Verbose logging for this plugin.
  debug: false

start:
  # How long a battle worker has to take a battle. Keep it close to the start queue's TTL (START_TTL_MS, 10 s).
  timeout: 10s
  # Attempts with the same battle id when no worker answers (a worker that already took it drops the copy).
  attempts: 2

battle:
  # GDD: 40 s per turn, after which the AI chooses for the player. 0 disables it.
  turn-timer-seconds: 40
  # The per-player lock (one battle at a time, network-wide). Refreshed on every request, so only an idle battle
  # outlives it.
  lock-ttl: 15m
  # A player who leaves for longer than this loses the battle with no penalty (GDD). Rejoining this server in time
  # resumes it.
  disconnect-grace: 60s
  # After asking a worker to stop a battle, how long to wait for its end before releasing the players anyway.
  end-timeout: 15s

rewards:
  # Product of every experience bonus for these battles; the formula itself is PokeCore's (modern, level-scaled).
  experience-multiplier: 1.0
  # Whether defeated creatures give their EV yield.
  effort-values: true
  # Friendship each rewarded creature gains for a win (not in the GDD: 0 by default).
  friendship-on-win: 0
  # Whether catching the opponent gives experience and EVs as defeating it would (modern rule).
  experience-on-capture: true

dialog:
  # Move buttons per row in the choice dialog.
  move-columns: 2

hud:
  # The battle drawn in front of the player with AstralHologram (Java players). false, without AstralHologram, or
  # for a Bedrock player: the choice dialog above.
  enabled: true
  # Whether sneaking leaves the HUD; /combat brings it back. The battle goes on either way.
  closeable: false
  # Blocks from the eye, for elements that set no depth.
  depth: 2.0
  # How far the view may turn from the centre, in degrees each way.
  look-yaw: 35
  look-pitch: 24
  # Whether the battle log also goes to the chat (the HUD shows its last lines).
  chat-log: true
  log-lines: 3
  # How long the HUD stays once the battle is over.
  close-delay: 2s
  # #AARRGGBB behind a hovered button, and behind one that cannot be used.
  hover-background: "#E026D971"
  disabled-background: "#60202020"
  # Sound keys, empty for none.
  hover-sound: "minecraft:ui.button.click"
  click-sound: ""
  # Health bars: `length` symbols, coloured high above 50 %, medium above 20 %, low below.
  bar:
    length: 20
    symbol: "|"
    high: "#26D971"
    medium: "#F2C94C"
    low: "#EB5757"
    empty: "#3A3A3A"
  # Where each element goes, in degrees right (yaw) and down (pitch) from the centre of view. Place them in game:
  # /hologram hud edit while the HUD is open prints these blocks; paste them here, then /pokebattle reload (applies
  # to the next HUD opened). Menu buttons are button-1, button-2... : add or remove some to change how many entries a
  # page holds.
  elements:
    timer:  { position: { yaw: 0, pitch: -20 }, scale: 0.5, background: false }
    foe:    { position: { yaw: 20, pitch: -15 }, scale: 0.55, background: true }
    ally:   { position: { yaw: -20, pitch: -3 }, scale: 0.55, background: true }
    log:    { position: { yaw: -20, pitch: 11 }, scale: 0.4, background: true }
    prompt: { position: { yaw: 22, pitch: -4 }, scale: 0.5, background: false }
    info:   { position: { yaw: 0, pitch: 4 }, scale: 0.4, background: true }
    button-1: { position: { yaw: 22, pitch: 0 }, scale: 0.45, background: true }
    button-2: { position: { yaw: 22, pitch: 4 }, scale: 0.45, background: true }
    button-3: { position: { yaw: 22, pitch: 8 }, scale: 0.45, background: true }
    button-4: { position: { yaw: 22, pitch: 12 }, scale: 0.45, background: true }
    button-5: { position: { yaw: 22, pitch: 16 }, scale: 0.45, background: true }
    button-6: { position: { yaw: 22, pitch: 20 }, scale: 0.45, background: true }
    back:   { position: { yaw: 16, pitch: 24 }, scale: 0.4, background: true }
    next:   { position: { yaw: 28, pitch: 24 }, scale: 0.4, background: true }
